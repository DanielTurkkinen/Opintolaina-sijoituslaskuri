name: Calculator regression tests

on:
  push:
  pull_request:

jobs:
  model-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check app.js
      - name: Run calculator tests
        run: node --test tests/model.test.cjs
